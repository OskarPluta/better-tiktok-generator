[project]
name = "tiktokv2"
version = "0.1.0"
description = "Build narrated vertical videos with cloned voices, music, and animated subtitles"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chatterbox-tts==0.1.7",
    "ffmpeg-python>=0.2.0",
    "kornia>=0.8.1",
    "moviepy>=2.2.1",
    "openai-whisper>=20250625",
    "stable-ts>=2.19.1",
    "timm>=1.0.20",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "transformers==5.2.0",
]
